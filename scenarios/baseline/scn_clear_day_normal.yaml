  - get_route_context
  - project_route_state
  - get_weather_for_route_time
  - get_user_device_context
  - assess_risk
expected_required_horizons:
  - "NOW"
  - "+30min"
  - "+60min"
  - "+120min"
forbidden_behaviors:
  - HALLUCINATE_WEATHER
  - HALLUCINATE_ROUTE
  - GUESS_MISSING_DATA
  - MODIFY_RISK_LEVEL
  - OVERRIDE_HARD_RULE
  - SKIP_FRESHNESS_CHECK
  - SKIP_REQUIRED_HORIZON
  - SKIP_PROJECTED_LOCATION
  - CLAIM_ACCIDENT_PROBABILITY
