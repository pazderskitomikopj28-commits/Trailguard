# TrailGuard replay scenario -- analog of spec scenario S01 (normal clear day).
#
# All values are mocked but internally consistent:
#   * the hiker sits at route progress 0.35 of replay/routes/scn_route_sample.gpx,
#     i.e. 3.85 km along an 11.0 km route: 7.15 km remaining, 1379 m altitude,
#     726 m of remaining ascent (matches the GPX geometry);
#   * analysis 12:30 local (10:30Z), sunset 20:40 local (18:40Z) = 490 min of
#     daylight left; the frozen movement model (spec 6.3) on 3.5/3.6/3.7 km/h with
#     fatigue_index 0.12 gives ~3.18 km/h, so the projected finish is ~135 min
#     away -- a time margin of ~355 min, far outside the R-B demo bands;
#   * pace drop is 2.7 % (R-D warn band is 15 %), projection battery at the finish
#     is ~69 % against the 4 %/h drain of the device timeline (R-E warn is 20 %),
#     off-route distance is 0.0 m -- the GPS fix sits exactly on the planned
#     polyline (R-A threshold is 50 m, so no deviation at all), and the replay weather
#     snapshot is 30 min old (budget 180 min) with gusts <= 27.4 km/h
#     (R-C threshold is 45 km/h): no rule is expected to fire;
#   * therefore expected_safety_core pins GREEN with no hard rules and no drivers.

scenario_id: S01_clear_day
description: >-
  Baseline clear-day scenario (analog of spec S01): good GPS, on-route, steady
  pace, comfortable battery, fresh replay weather. Expect the agent to call all
  five atomic tools, cover all four horizons, report the safety margins and the
  weather freshness, and produce a GREEN (or at most YELLOW) verdict with no hard
  rule triggered. This is the "nothing is wrong" control case of the dataset.
category: baseline
is_synthetic: true
simulation_note: >-
  Synthetic input data authored for the TrailGuard benchmark; not a real hike, not
  a real weather record and not a real incident record (spec 27). Every threshold
  referenced in this file is a TrailGuard demo-calibration value (spec 7, 12) and
  must never be presented as an industry safety standard.
task_prompt: >-
  Analyse this hiker's current situation and the required future horizons, then
  report a safety assessment. Use the available tools to get the route context,
  the device context and the weather for the route time; project the hiker's state
  at each required horizon; run the risk assessment for each horizon. In your
  answer report: the risk level, which rules triggered and why, the explainable
  safety margins (time margin, projected battery, route deviation, weather
  freshness, projection confidence), the weather source and its age, and any data
  limitation or uncertainty the hiker should know about. Never invent a value a
  tool did not return, never edit the deterministic core's verdict, and never
  present a likelihood of harm as a number.
route_ref: "replay/routes/scn_route_sample.gpx"
weather_snapshot_ref: "replay/weather/scn_weather_snapshot.json"
