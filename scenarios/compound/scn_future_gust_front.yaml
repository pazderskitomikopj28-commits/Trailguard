# TrailGuard Phase 5 benchmark scenario -- B06_future_gust_front.
#
# The future-horizon coverage case: the NOW row of the replay snapshot is a safe 28 km/h gust and the +30-minute row is a 50 km/h front, so the same hiker is safe now and not safe in half an hour.
#
# All values are mocked but internally consistent:
#   * the replay snapshot scn_weather_gust_front.json ramps gusts 28, 50, 72 and 74 km/h across 12:00Z to 15:00Z, and the projected arrivals at 12:10, 12:40, 13:10 and 14:10 read the 28, 50, 50 and 72 km/h rows;
#   * R-C's condition names the projected position x projected arrival time, never the current location, so the 28 km/h NOW row and the 50 km/h +30 row are both correct answers to the same question asked about different horizons;
#   * R-C fires from +30min onward, contributing HIGH severity and 40 soft-score points, which lands in the YELLOW band;
#   * no other rule fires: 14.0 m off route, 268.0 minutes of margin, 3.7 % pace drop and a projected battery of 61.9 %.;
#   * the replay weather snapshot is 30 minutes old at analysis time, well inside the 180-minute freshness budget (scn_weather_gust_front.json), so its freshness status is FRESH at every horizon.
#
# The point of this scenario is the route-aware weather contract: an assessment that only looks at the hiker's current weather is correct at NOW and wrong at three horizons, and the miss is a silent one because the NOW answer is right. risk_level is deliberately not pinned because the four horizons do not agree.
#
# This file is a synthetic input. It is NOT a real hiker, NOT a real device log and NOT a
# real incident record (spec 27). Every threshold its values are compared against is a
# TrailGuard demo-calibration value (spec 7, 12), never an industry safety standard, and no
# number here may be reported as a real-world accident, miss or false-alarm rate.
scenario_id: B06_future_gust_front
description: >-
  The future-horizon coverage case: the NOW row of the replay snapshot is a safe 28 km/h gust and the +30-minute row is a 50 km/h front, so the same hiker is safe now and not safe in half an hour.
category: compound
is_synthetic: true
simulation_note: >-
  Synthetic input data authored for the TrailGuard Phase 5 benchmark; not a real hiker, not
  a real device log and not a real incident record (spec 27). The ages, distances and speeds
  are invented demo values, and every rule threshold they are compared against is a
  TrailGuard demo-calibration value (spec 7, 12), never an industry safety standard.
task_prompt: >-
  Analyse this hiker's current situation and the required future horizons, then report a safety assessment. Use the available tools to get the route context, the device context and the weather for the route time; project the hiker's state at each required horizon; run the risk assessment for each horizon. In your answer report: the risk level, which rules triggered and why, the explainable safety margins (time margin, projected battery, route deviation, weather freshness, projection confidence), the weather source and its age, and any data limitation or uncertainty the hiker should know about. Never invent a value a tool did not return, never edit the deterministic core's verdict, and never present a likelihood of harm as a number.
