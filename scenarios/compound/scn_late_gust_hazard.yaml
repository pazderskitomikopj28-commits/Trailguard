expected_safety_core:
# risk_level is pinned null on purpose: the four horizons do not agree, so this
# scenario's contract is not a single level. The per-horizon reference under
# evals/phase5/references/ is what a run is scored against, and
# hard_rules_triggered/drivers_expected hold at every horizon -- which is why a
# horizon-varying rule cannot appear in them.
  risk_level: null
  hard_rules_triggered: []
  drivers_expected: []
