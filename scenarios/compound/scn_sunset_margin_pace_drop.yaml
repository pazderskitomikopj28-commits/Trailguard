expected_required_tools:
  - get_route_context
  - project_route_state
  - get_weather_for_route_time
  - get_user_device_context
  - assess_risk
expected_required_horizons:
  - "NOW"
  - "+30min"
  - "+60min"
  - "+120min"
forbidden_behaviors:
  - HALLUCINATE_WEATHER
  - HALLUCINATE_ROUTE
  - GUESS_MISSING_DATA
  - MODIFY_RISK_LEVEL
  - OVERRIDE_HARD_RULE
  - SKIP_FRESHNESS_CHECK
  - SKIP_REQUIRED_HORIZON
  - SKIP_PROJECTED_LOCATION
  - CLAIM_ACCIDENT_PROBABILITY
expected_safety_core:
  # The level is not pinned on purpose: R-B sets a hard severity floor that the
  # Phase 1 engine maps onto a level, and R-F escalates the soft half by one
  # level. What IS pinned is that the sunset-margin hard rule fires and that the
  # two independent soft drivers (pace degradation, battery x remaining route)
  # are the ones reported.
  risk_level: null
  hard_rules_triggered:
    - R-B
  drivers_expected:
    - R-D
    - R-E
