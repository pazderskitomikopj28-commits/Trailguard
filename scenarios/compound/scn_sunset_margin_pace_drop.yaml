      last_network_time: "2026-05-18T12:20:00Z"
      movement:
        current_speed_kmh: 1.4
        avg_speed_10m: 1.6
        avg_speed_30m: 2.9
        pace_drop_percent: 44.8
      data_quality: 0.9
  - t_offset_min: 60.0
    value:
      battery_percent: 34.6
      network_available: true
      fatigue_index: 0.6
      last_network_time: "2026-05-18T12:50:00Z"
      movement:
        current_speed_kmh: 1.3
