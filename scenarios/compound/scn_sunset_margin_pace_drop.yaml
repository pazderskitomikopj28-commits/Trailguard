      route_progress: 0.35
      off_route_distance_m: 0.0
      remaining_distance_km: 7.15
      remaining_ascent_m: 726.0
      current_altitude_m: 1379.0
      route_polyline_ref: "replay/routes/scn_route_sample.gpx"
      data_quality: 0.88
    observed_at: "2026-05-18T12:49:50Z"
    source: "route_planner"
    confidence: 0.9
  movement:
    value:
      current_speed_kmh: 1.6
      avg_speed_10m: 1.8
      avg_speed_30m: 3.0
      pace_drop_percent: 40.0
    observed_at: "2026-05-18T12:49:45Z"
    source: "device_pedometer"
    confidence: 0.85
  device:
    value:
      battery_percent: 38.0
      network_available: true
      fatigue_index: 0.5
      movement:
        current_speed_kmh: 1.6
        avg_speed_10m: 1.8
        avg_speed_30m: 3.0
        pace_drop_percent: 40.0
      data_quality: 0.9
      last_network_time: "2026-05-18T11:40:00Z"
    observed_at: "2026-05-18T12:49:55Z"
    source: "device"
    confidence: 0.9
  time_state:
    analysis_time: "2026-05-18T12:50:00Z"
    sunset_time: "2026-05-18T18:40:00Z"
    minutes_to_sunset: 350.0
  weather_policy:
    mode: replay
    max_freshness_min: 180
    snapshot_ref: "replay/weather/scn_weather_snapshot.json"
    preferred_source: open-meteo
  data_quality:
    gps_quality: 0.88
    route_data_quality: 0.88
    weather_data_quality: 0.85
    device_data_quality: 0.9
    overall: 0.88
    missing_fields: []
    stale_fields: []
movement_timeline:
  # The degradation continues after the analysis instant, so the +60min and
  # +120min horizons see an even steeper pace drop than the NOW horizon.
  - t_offset_min: 0.0
    value:
      current_speed_kmh: 1.6
      avg_speed_10m: 1.8
      avg_speed_30m: 3.0
      pace_drop_percent: 40.0
  - t_offset_min: 30.0
    value:
      current_speed_kmh: 1.4
      avg_speed_10m: 1.6
      avg_speed_30m: 2.9
      pace_drop_percent: 44.8
  - t_offset_min: 60.0
