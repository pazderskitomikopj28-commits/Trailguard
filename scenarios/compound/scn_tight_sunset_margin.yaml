# TrailGuard Phase 5 benchmark scenario -- B04_tight_sunset_margin.
#
# The compact R-B case: a slow hiker, 8.3 km from the finish, whose estimated completion lands 14.1 minutes BEFORE sunset -- inside the 30-minute warn band, so R-B fires, and because the pack assigns R-B a CRITICAL severity regardless of band the floor is RED.
#
# All values are mocked but internally consistent:
#   * the frozen movement model (0.5*avg_speed_10m + 0.3*avg_speed_30m + 0.2*current_speed, then *(1 - fatigue_index) with the 0.30 fatigue index) gives an effective speed of 1.099 km/h and an estimated 450.7 minutes to the finish;
#   * 465 minutes remain to sunset at 10:55, so time_margin_min = 465 - 450.7 = +14.11 minutes: POSITIVE, i.e. the hiker is estimated to finish before dark;
#   * R-B's warn clause is time_margin_min < 30, so a positive margin of 14.1 minutes still triggers it, and the hard-rule severity floor maps the pack's CRITICAL severity to RED;
#   * the soft score is 0 -- no soft rule fires -- so RED here is entirely the floor;
#   * the projected battery at the finish is 41.9 % and the gust stays between 24.6 and 27.4 km/h, so neither R-E nor R-C contributes.;
#   * the replay weather snapshot is 55 minutes old at analysis time, well inside the 180-minute freshness budget (scn_weather_snapshot.json), so its freshness status is FRESH at every horizon.
#
# The point of this scenario is that a positive time margin and a RED verdict are not contradictory in this rule pack, and that the floor is set by the rule's severity rather than by the band that was crossed. A run that reports YELLOW or ORANGE because 'the hiker gets back before sunset' has substituted its own judgement for the core's floor.
#
# This file is a synthetic input. It is NOT a real hiker, NOT a real device log and NOT a
# real incident record (spec 27). Every threshold its values are compared against is a
# TrailGuard demo-calibration value (spec 7, 12), never an industry safety standard, and no
# number here may be reported as a real-world accident, miss or false-alarm rate.
