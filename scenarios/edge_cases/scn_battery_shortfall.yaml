# TrailGuard Phase 5 benchmark scenario -- B09_battery_shortfall.
#
# The R-E coverage case: 30 % of battery against an estimated 290.7-minute walk projects to 10.6 % at the route finish, past the rule's 20 % warn band and short of its 10 % critical one.
#
# All values are mocked but internally consistent:
#   * the projection is the calibrated drain of 4 %/h applied to the estimated time to the finish, recorded in trailguard/rules/calibration_v1.yaml; the device feed's own observed decline of 2 %/30min is narrative only and is not what the rule reads;
#   * the projected battery is 10.62 % at NOW and rises to 18.62 % at +120min, because the horizon shortens the remaining walk by the same amount it advances the clock -- so R-E fires at all four horizons and the warn band holds;
#   * R-E's severity is HIGH, contributing 40 soft-score points, which lands in the YELLOW band;
#   * the time margin is 174.2 minutes, the pace drop 4.5 % and the off-route distance 8.00 m;
#   * the hiker still has a network link, which the rule reports as context and does not use to gate the trigger -- a bare battery threshold is what R-E exists to replace.;
#   * the replay weather snapshot is 55 minutes old at analysis time, well inside the 180-minute freshness budget (scn_weather_snapshot.json), so its freshness status is FRESH at every horizon.
#
# The point of this scenario is that R-E is a projection, not a reading: the battery is 30 % now and the verdict is about the 10.6 % it projects to at the finish. A run that reports 'battery 30 %, not a hazard' has answered a question the rule did not ask.
#
# This file is a synthetic input. It is NOT a real hiker, NOT a real device log and NOT a
# real incident record (spec 27). Every threshold its values are compared against is a
# TrailGuard demo-calibration value (spec 7, 12), never an industry safety standard, and no
# number here may be reported as a real-world accident, miss or false-alarm rate.
scenario_id: B09_battery_shortfall
description: >-
  The R-E coverage case: 30 % of battery against an estimated 290.7-minute walk projects to 10.6 % at the route finish, past the rule's 20 % warn band and short of its 10 % critical one.
category: edge_cases
is_synthetic: true
simulation_note: >-
  Synthetic input data authored for the TrailGuard Phase 5 benchmark; not a real hiker, not
  a real device log and not a real incident record (spec 27). The ages, distances and speeds
  are invented demo values, and every rule threshold they are compared against is a
  TrailGuard demo-calibration value (spec 7, 12), never an industry safety standard.
task_prompt: >-
  Analyse this hiker's current situation and the required future horizons, then report a safety assessment. Use the available tools to get the route context, the device context and the weather for the route time; project the hiker's state at each required horizon; run the risk assessment for each horizon. In your answer report: the risk level, which rules triggered and why, the explainable safety margins (time margin, projected battery, route deviation, weather freshness, projection confidence), the weather source and its age, and any data limitation or uncertainty the hiker should know about. Never invent a value a tool did not return, never edit the deterministic core's verdict, and never present a likelihood of harm as a number.
