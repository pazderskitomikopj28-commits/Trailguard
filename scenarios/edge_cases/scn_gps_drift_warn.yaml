# TrailGuard Phase 5 benchmark scenario -- B02_gps_drift_warn.
#
# The R-A coverage case: the hiker's fix sits 75 m off the planned polyline, past the rule's 50 m threshold and short of its 150 m severe band, with every other signal calm.
#
# All values are mocked but internally consistent:
#   * the coordinate was solved against the replay GPX so the measured off_route_distance_m is 75.00 m;
#   * R-A's persistence_observations: 3 threshold is declared non-evaluable by the calibration, so a single assess_risk call reports the deviation as measured and does not assert persistence;
#   * the time margin is 318.7 minutes and the projected battery 69.9 %, so neither R-B nor R-E fires;
#   * the projected gust stays between 24.6 and 27.4 km/h, so R-C does not fire;
#   * the soft score is therefore 0, and ORANGE comes only from R-A's HIGH severity floor.;
#   * the replay weather snapshot is 50 minutes old at analysis time, well inside the 180-minute freshness budget (scn_weather_snapshot.json), so its freshness status is FRESH at every horizon.
#
# The point of this scenario is the hard-rule floor with no soft score behind it: the level is ORANGE because a hard rule fired, not because anything accumulated. A run that reports GREEN, YELLOW or RED has overridden the core's floor in one direction or the other.
#
# This file is a synthetic input. It is NOT a real hiker, NOT a real device log and NOT a
# real incident record (spec 27). Every threshold its values are compared against is a
# TrailGuard demo-calibration value (spec 7, 12), never an industry safety standard, and no
# number here may be reported as a real-world accident, miss or false-alarm rate.
scenario_id: B02_gps_drift_warn
description: >-
  The R-A coverage case: the hiker's fix sits 75 m off the planned polyline, past the rule's 50 m threshold and short of its 150 m severe band, with every other signal calm.
category: edge_cases
is_synthetic: true
simulation_note: >-
  Synthetic input data authored for the TrailGuard Phase 5 benchmark; not a real hiker, not
  a real device log and not a real incident record (spec 27). The ages, distances and speeds
  are invented demo values, and every rule threshold they are compared against is a
  TrailGuard demo-calibration value (spec 7, 12), never an industry safety standard.
task_prompt: >-
  Analyse this hiker's current situation and the required future horizons, then report a safety assessment. Use the available tools to get the route context, the device context and the weather for the route time; project the hiker's state at each required horizon; run the risk assessment for each horizon. In your answer report: the risk level, which rules triggered and why, the explainable safety margins (time margin, projected battery, route deviation, weather freshness, projection confidence), the weather source and its age, and any data limitation or uncertainty the hiker should know about. Never invent a value a tool did not return, never edit the deterministic core's verdict, and never present a likelihood of harm as a number.
