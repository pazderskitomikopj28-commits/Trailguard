# TrailGuard Phase 5 benchmark scenario -- B08_gust_band_clearing.
#
# The clearing-gust case: a gust band of 49 km/h crosses the hiker between 12:00Z and 13:00Z and is gone by 13:00Z, so R-C fires at NOW and +30min and is silent at +60min and +120min.
#
# All values are mocked but internally consistent:
#   * the replay snapshot scn_weather_gust_clearing.json is NON-MONOTONE on purpose: gusts 21, 49, 22 and 20 km/h across 11:00Z to 14:00Z;
#   * the projected arrivals at 11:40, 12:10, 12:40 and 13:40 read the 49, 49, 22 and 20 km/h rows;
#   * R-C fires at the first two horizons, contributing 40 soft-score points and a YELLOW band, and fires nowhere else;
#   * no other rule fires at any horizon: 12.0 m off route, 231.4 minutes of margin, 2.9 % pace drop and a projected battery of 77.4 %.;
#   * the replay weather snapshot is 40 minutes old at analysis time, well inside the 180-minute freshness budget (scn_weather_gust_clearing.json), so its freshness status is FRESH at every horizon.
#
# The point of this scenario is that a hazard can clear. A run that carries the gust band forward to +60min or +120min contradicts the core there, and the contradiction is invisible in the NOW answer. risk_level is deliberately not pinned because the four horizons do not agree.
#
# This file is a synthetic input. It is NOT a real hiker, NOT a real device log and NOT a
# real incident record (spec 27). Every threshold its values are compared against is a
# TrailGuard demo-calibration value (spec 7, 12), never an industry safety standard, and no
# number here may be reported as a real-world accident, miss or false-alarm rate.
scenario_id: B08_gust_band_clearing
description: >-
  The clearing-gust case: a gust band of 49 km/h crosses the hiker between 12:00Z and 13:00Z and is gone by 13:00Z, so R-C fires at NOW and +30min and is silent at +60min and +120min.
