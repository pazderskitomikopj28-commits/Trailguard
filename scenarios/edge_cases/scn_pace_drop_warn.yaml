# TrailGuard Phase 5 benchmark scenario -- B07_pace_drop_warn.
#
# The R-D coverage case: the 10-minute window has fallen 16.7 % behind the 30-minute one, past the rule's 15 % warn band and short of its 25 % high band, with everything else calm.
#
# All values are mocked but internally consistent:
#   * pace_drop_percent is carried by the device feed as 16.7 %, and the feature extractor prefers a reported value over the one it would derive from the two windows -- which here agrees with it, since (3.0 - 2.5) / 3.0 = 16.7 %;
#   * R-D's severity is MEDIUM, contributing 25 soft-score points, which lands exactly in the YELLOW band (25..49);
#   * the hard score is 0: R-D is a soft rule, so no floor applies and no hard rule fires;
#   * the time margin is 305.9 minutes, the projected battery 74.7 % and the gust 23.1 to 26.2 km/h;
#   * the off-route distance is 4.00 m.;
#   * the replay weather snapshot is 15 minutes old at analysis time, well inside the 180-minute freshness budget (scn_weather_snapshot.json), so its freshness status is FRESH at every horizon.
#
# The point of this scenario is that a single MEDIUM soft rule is the ONLY way a run can land on YELLOW in this rule pack: one soft rule contributes at most 40 points (R-C, HIGH) and two or more trigger R-F, which escalates to RED. YELLOW is therefore a narrow, load-bearing band and this scenario is the one that exercises it.
#
# This file is a synthetic input. It is NOT a real hiker, NOT a real device log and NOT a
# real incident record (spec 27). Every threshold its values are compared against is a
# TrailGuard demo-calibration value (spec 7, 12), never an industry safety standard, and no
# number here may be reported as a real-world accident, miss or false-alarm rate.
scenario_id: B07_pace_drop_warn
description: >-
  The R-D coverage case: the 10-minute window has fallen 16.7 % behind the 30-minute one, past the rule's 15 % warn band and short of its 25 % high band, with everything else calm.
category: edge_cases
