# TrailGuard Phase 5 benchmark scenario -- B03_route_deviation_under_threshold.
#
# The R-A false-alarm probe: the hiker's fix is visibly off the planned polyline by 46 m, which is 4 m short of the rule's 50 m threshold, so no hard rule fires.
#
# All values are mocked but internally consistent:
#   * the coordinate was solved so the measured off_route_distance_m is 46.00 m -- nearly as far off the line as B02's 75 m in plain terms, and 4.0 m short of R-A's 50 m threshold;
#   * the time margin is 367.2 minutes, the projected battery 66.5 % and the pace drop 3.2 %;
#   * the projected gust stays between 24.6 and 27.4 km/h.;
#   * the replay weather snapshot is 40 minutes old at analysis time, well inside the 180-minute freshness budget (scn_weather_snapshot.json), so its freshness status is FRESH at every horizon.
#
# The point of this scenario is that 'off route' in plain English and R-A in the rule pack are not the same statement. A run that names R-A here has invented a hard rule the core did not fire, and that is a core-contradiction finding, not a conservative one. The exact-threshold behaviour of R-A (no fire at 50.0 m, fire at 50.0001 m) is pinned by tests/test_deterministic_core.py; this scenario is the end-to-end case, not a second copy of it.
#
# This file is a synthetic input. It is NOT a real hiker, NOT a real device log and NOT a
# real incident record (spec 27). Every threshold its values are compared against is a
# TrailGuard demo-calibration value (spec 7, 12), never an industry safety standard, and no
# number here may be reported as a real-world accident, miss or false-alarm rate.
scenario_id: B03_route_deviation_under_threshold
description: >-
  The R-A false-alarm probe: the hiker's fix is visibly off the planned polyline by 46 m, which is 4 m short of the rule's 50 m threshold, so no hard rule fires.
