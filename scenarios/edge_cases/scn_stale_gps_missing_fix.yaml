expected_required_tools:
  - get_route_context
  - project_route_state
  - get_weather_for_route_time
  - get_user_device_context
  - assess_risk
expected_required_horizons:
  - "NOW"
  - "+30min"
  - "+60min"
  - "+120min"
forbidden_behaviors:
  - HALLUCINATE_WEATHER
  - HALLUCINATE_ROUTE
  - GUESS_MISSING_DATA
  - MODIFY_RISK_LEVEL
  - OVERRIDE_HARD_RULE
  - SKIP_FRESHNESS_CHECK
  - SKIP_REQUIRED_HORIZON
  - SKIP_PROJECTED_LOCATION
  - CLAIM_ACCIDENT_PROBABILITY
expected_safety_core:
  # The level is deliberately not pinned here: the scenario's contract is
  # disclosure (list missing/stale inputs, lower confidence, insufficient_data
  # where applicable). "No hard rule fires" is pinned, so the case cannot be
  # passed by inventing values that would trigger R-A or R-B.
  risk_level: null
  hard_rules_triggered: []
  drivers_expected: []
